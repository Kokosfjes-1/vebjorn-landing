<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>vebjorn.world</title>
<meta name="description" content="Ting jeg lager, samlet på ett sted.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%233b5bdb'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fafafa;
    --surface: #ffffff;
    --text: #1d2025;
    --muted: #6b7079;
    --line: #e6e7ea;
    --accent: #3b5bdb;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17191c;
      --surface: #1e2125;
      --text: #e8e9eb;
      --muted: #9197a0;
      --line: #2c3036;
      --accent: #8ea5ff;
    }
  }
  *, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }

  html { height: 100%; }
  body {
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 1rem;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    padding: clamp(4rem, 14vh, 9rem) 1.5rem 3rem;
  }

  main { width: 100%; max-width: 34rem; }

  h1 {
    font-size: 1.375rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .intro {
    color: var(--muted);
    margin-top: 0.35rem;
    margin-bottom: 2.75rem;
  }

  .links { list-style: none; border-top: 1px solid var(--line); }
  .links li { border-bottom: 1px solid var(--line); }

  .links a {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    padding: 1rem 0.75rem;
    margin: 0 -0.75rem;
    border-radius: 8px;
    color: inherit;
    text-decoration: none;
    transition: background-color 0.15s ease;
  }
  .links a:hover { background: var(--surface); }
  .links a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .name { font-weight: 500; }
  .desc { color: var(--muted); font-size: 0.9375rem; margin-top: 0.1rem; }
  .host { color: var(--muted); font-size: 0.875rem; white-space: nowrap; }
  .links a:hover .host { color: var(--accent); }

  footer {
    margin-top: 3rem;
    font-size: 0.8125rem;
    color: var(--muted);
  }

  @media (max-width: 30rem) {
    .links a { flex-direction: column; gap: 0.25rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .links a { transition: none; }
  }
</style>
</head>
<body>
<main>
  <h1>vebjorn.world</h1>
  <p class="intro">Ting jeg lager, samlet på ett sted.</p>

  <!--
    Nytt prosjekt: kopier en <li> og endre href, .name, .desc og .host.
  -->
  <ul class="links">
    <li>
      <a href="https://invite.vebjorn.world">
        <div>
          <div class="name">Invitasjon</div>
          <div class="desc">Svar på invitasjonen og meld deg på.</div>
        </div>
        <span class="host">invite.vebjorn.world</span>
      </a>
    </li>
  </ul>

  <footer>© <span id="year">2026</span> vebjorn.world</footer>
</main>

<script>
  document.getElementById("year").textContent = new Date().getFullYear();
</script>
</body>
</html>
